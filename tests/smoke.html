    /* ---------------- switching languages keeps progress separate ---------------- */
    async function checkSwitching() {
      await T.setSettings({ uiLang: 'en', lang: 'fa', level: 'beginner', track: 'full', speech: false });
      const S = T.state();
      const faTopic = T.TOPICS.find((tp) => tp.kind !== 'alphabet');
      S.langs.fa.topics[faTopic.id] = { best: 100, stages: { learn: 3, choice: 3 } };
      S.langs.fa.words[faTopic.items[0].id] = 5;
      S.langs.fa.speedBest = 12;
      S.xp = 50;
      T.renderMenu();
      $('.lang-chip').click();
      if (!$('.lang-page') || $$('.lang-card').length !== 4) { err('language chip did not open the picker'); return; }
      if (!app.querySelector('[data-pick="fa"].selected')) err('current language not marked in the picker');
      app.querySelector('[data-pick="ar"]').click();
      // A new language is set up first (level + track only).
      if (!$('.onboard')) { err('new language: no set-up screen'); return; }
      if (html.dataset.lang !== 'ar') err('set-up screen not in the Arabic theme');
      if ($$('.dots i').length !== 2) err(`new-language set-up has ${$$('.dots i').length} steps, expected 2`);
      $$('.choice')[1].click(); $('#ob-next').click();
      $$('.choice')[0].click(); $('#ob-next').click();
      await waitFor(() => $('.menu') && T.cur() === 'ar');
      if (T.cur() !== 'ar' || !$('.menu')) { err('switch to Arabic failed'); return; }
      if (S.langs.ar.level !== 'intermediate' || S.langs.ar.track !== 'speak') err('Arabic set-up not saved');
      if (Object.keys(S.langs.ar.topics).length || Object.keys(S.langs.ar.words).length) err('Arabic started with progress from another language');
      if (S.langs.fa.topics[faTopic.id].stages.choice !== 3 || S.langs.fa.words[faTopic.items[0].id] !== 5) err('Farsi progress changed by switching');
      if (S.xp !== 50) err('XP is not global');
      if ($('.mode.speed small').textContent.includes('12')) err('Farsi speed record shown for Arabic');
      if ($$('.menu .mini-bar i').some((i) => parseFloat(i.style.width) > 0)) err('Arabic menu shows progress');
      // Practise a bit in Arabic: only Arabic progress changes.
      const arTopic = T.TOPICS.find((tp) => tp.kind !== 'alphabet');
      T.startStage(arTopic, 'truefalse');
      playSession('switch/ar');
      if (!S.langs.ar.topics[arTopic.id]) err('Arabic progress not recorded under langs.ar');
      const faWords = JSON.stringify(S.langs.fa.words);
      // Back to Farsi from Settings: it's set up, so it opens straight away with its own progress.
      T.renderSettings();
      app.querySelector('.lang-seg [data-pick="fa"]').click();
      await waitFor(() => $('.menu') && T.cur() === 'fa');
      if (T.cur() !== 'fa' || html.dataset.lang !== 'fa') { err('switch back to Farsi failed'); return; }
      if (JSON.stringify(S.langs.fa.words) !== faWords) err('Farsi words changed while practising Arabic');
      if (!$('.mode.speed small').textContent.includes('12')) err('Farsi speed record lost');
      if (!$$('.menu .mini-bar i').some((i) => parseFloat(i.style.width) > 0)) err('Farsi progress not shown after switching back');
      T.renderDictionary();
      if (!$('#dict-learned').textContent.includes('1')) err('Farsi dictionary lost its learned word');
      // Same lesson ids in two languages never share progress.
      if (S.langs.ar.topics[faTopic.id] && faTopic.id !== arTopic.id) err('Farsi topic id showed up in Arabic');
      // Persisted.
      const saved = JSON.parse(localStorage.getItem(T.STORE_KEY));
      if (!saved.langs.ar || !saved.langs.fa || saved.settings.lang !== 'fa') err('per-language state not saved');
    }

    /* ---------------- themes: fallback when missing or broken ---------------- */
    async function checkThemes() {
      await T.setSettings({ uiLang: 'en', lang: 'es', level: 'beginner', track: 'full', speech: false });
      const real = window.TLAP_THEMES.es;
      delete window.TLAP_THEMES.es;
      T.applyTheme('es');
      T.renderMenu();
      if (!$('.menu .mascot .fallback-mascot')) err('missing theme: no fallback mascot');
      if ($('.theme-deco')) err('missing theme: decorations shown');
      if (!html.classList.contains('theme-fallback')) err('missing theme: html has no theme-fallback class');
      const fb = STR.en.m_greet.map((s) => s.replace('{lang}', 'Spanish'));
      if (!fb.includes($('.menu .bubble').textContent)) err('missing theme: greeting is not a built-in line: ' + $('.menu .bubble').textContent);
      // A theme whose mascot throws, with half its lines missing.
      window.TLAP_THEMES.es = { name: { en: 'Spanish' }, mascot: { svg() { throw new Error('boom'); } }, lines: { greet: { en: [] } }, decorations: { banner: 7 } };
      T.applyTheme('es');
      T.renderMenu();
      if (!$('.menu .mascot .fallback-mascot')) err('broken theme: no fallback mascot');
      T.renderGroup(T.visibleGroups()[0]);
      if (!$('.mascot-row .bubble').textContent) err('broken theme: empty mascot line');
      if (real) window.TLAP_THEMES.es = real; else delete window.TLAP_THEMES.es;
      T.applyTheme('es');
      T.renderMenu();
      if (real && $('.menu .mascot .fallback-mascot')) err('theme not restored');
      // Every real theme renders all three moods as SVG, and has every line in both languages.
      ['fa', 'es', 'ja', 'ar'].forEach((code) => {
        const th = window.TLAP_THEMES[code];
        if (!th) return;
        ['happy', 'cheer', 'sad'].forEach((m) => { if (!/^\s*<svg/i.test(T.mascotSVG(m, code)) || /fallback-mascot/.test(T.mascotSVG(m, code))) err(`${code} theme: mascot mood ${m}`); });
        ['intro', 'greet', 'group', 'topic', 'right', 'wrong', 'empty'].forEach((k) => ['en', 'he'].forEach((u) => {
          if (!th.lines || !th.lines[k] || !th.lines[k][u] || !th.lines[k][u].length) err(`${code} theme: line ${k}.${u} missing`);
        }));
        if (!Array.isArray(th.confetti) || !th.confetti.length) err(`${code} theme: no confetti colors`);
      });
    }

    /* ---------------- answer checking per language ---------------- */
    function checkAnswers() {
      const ct = [
        ['fa', 'salam', 'salâm', 'exact'], ['fa', 'khodahafez', 'khodâhâfez', 'exact'], ['fa', 'xodahafez', 'khodâhâfez', 'exact'],
        ['fa', 'khodahafz', 'khodâhâfez', 'almost'], ['fa', 'hello', 'salâm', 'no'], ['fa', '', 'salâm', 'no'],
        ['fa', 'esme man sara ast', 'esm-e man sârâ ast.', 'exact'], ['fa', 'to', 'to', 'exact'], ['fa', 'ta', 'to', 'no'],
        ['ar', 'marhaba', 'marḥaba', 'exact'], ['ar', 'arabi', '3arabi', 'exact'], ['ar', '3arabi', '3arabi', 'exact'],
        ['ar', '7abibi', 'ḥabībi', 'exact'], ['ar', 'shukran', 'shukran', 'exact'], ['ar', 'shukra', 'shukran', 'almost'],
        ['ja', 'toukyou', 'tōkyō', 'exact'], ['ja', 'tokyo', 'tōkyō', 'exact'], ['ja', 'arigato', 'arigatō', 'exact'],
        ['ja', 'arigatou', 'arigatō', 'exact'], ['ja', 'konichiwa', 'konnichiwa', 'almost'], ['ja', 'sayonara', 'konnichiwa', 'no'],
        ['ja', 'shinbun', 'shimbun', 'exact'], ['ja', 'watashi wa gakusei desu', 'watashi wa gakusei desu', 'exact'],
      ];
      ct.forEach(([code, a, b, want]) => { const got = T.compareTr(a, b, code); if (got !== want) err(`compareTr[${code}](${a}, ${b}) = ${got}, want ${want}`); });
      const typed = [
        ['es', 'adiós', { tg: 'adiós' }, 'exact'], ['es', 'Adios', { tg: 'adiós' }, 'almost'], ['es', 'que tal', { tg: '¿Qué tal?' }, 'almost'],
        ['es', '¿Qué tal?', { tg: '¿Qué tal?' }, 'exact'], ['es', 'nino', { tg: 'niño' }, 'almost'], ['es', 'HOLA', { tg: 'hola' }, 'exact'],
        ['es', 'gato', { tg: 'perro' }, 'no'], ['es', 'buenos dias', { tg: 'buenos días' }, 'almost'],
        ['ja', 'こんにちは', { tg: 'こんにちは', tr: 'konnichiwa', kana: 'こんにちは' }, 'exact'],
        ['ja', 'コンニチハ', { tg: 'こんにちは', tr: 'konnichiwa', kana: 'こんにちは' }, 'exact'],
        ['ja', 'たべる', { tg: '食べる', tr: 'taberu', kana: 'たべる' }, 'exact'], ['ja', 'taberu', { tg: '食べる', tr: 'taberu', kana: 'たべる' }, 'exact'],
        ['ja', 'のむ', { tg: '食べる', tr: 'taberu', kana: 'たべる' }, 'no'],
        ['fa', 'salam', { tg: 'سلام', tr: 'salâm' }, 'exact'],
      ];
      typed.forEach(([code, a, it, want]) => { const got = T.checkTyped(a, it, code); if (got !== want) err(`checkTyped[${code}](${a}, ${it.tg}) = ${got}, want ${want}`); });
      const sp = [
        ['fa', 'سلام', 'سلام', null, true], ['fa', 'سلام خوبی', 'سلام', null, true], ['fa', 'خداحافظ', 'سلام', null, false],
        ['fa', 'سلام', 'سلام', null, true],
        ['ar', 'مَرْحَبًا', 'مرحبا', null, true], ['ar', 'احمد', 'أحمد', null, true], ['ar', 'تلاته', 'تلاتة', null, true],
        ['ar', 'حكي', 'حكى', null, true], ['ar', 'مرحبا', 'شكرا', null, false], ['ar', 'شـكـرا', 'شكرا', null, true],
        ['ja', '東京', '東京', 'とうきょう', true], ['ja', 'とうきょう', '東京', 'とうきょう', true], ['ja', 'トウキョウ', '東京', 'とうきょう', true],
        ['ja', 'お元気 ですか？', 'お元気ですか', 'おげんきですか', true], ['ja', 'さようなら', 'こんにちは', 'こんにちは', false],
        ['es', 'Adiós', 'adiós', null, true], ['es', 'que tal', '¿Qué tal?', null, true], ['es', 'gracias', 'adiós', null, false],
      ];
      sp.forEach(([code, heard, tg, kana, want]) => { if (T.speechMatches(heard, tg, kana, code) !== want) err(`speechMatches[${code}](${heard}, ${tg}) != ${want}`); });
    }

    /* ---------------- progress: smart review, daily goal, badges ---------------- */
    async function checkProgress() {
      const code = langs[0];
      await T.setSettings({ uiLang: 'en', lang: code, level: 'beginner', track: 'full', speech: true });
      const S = T.state();
      const E = STR.en;
      const today = T.todayNum();
      const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
      // Days are counted in local time.
      if (T.dayNum(new Date(1970, 0, 1)) !== 0 || T.dayNum(new Date(1970, 0, 2, 0, 30)) !== 1) err('progress: dayNum is not local days since 1970');
      const now = new Date();
      if (T.dayNum(new Date(now.getFullYear(), now.getMonth(), now.getDate(), 23, 59)) !== today) err('progress: late evening is not today');

      // Migration: an old save gets a review schedule from its word strengths; nothing else changes.
      const oldWords = { 'a:0': 1, 'a:1': 2, 'a:2': 3, 'a:3': 4, 'a:4': 5, 'a:5': 0 };
      const old = () => ({ v: 2, settings: { uiLang: 'en', lang: code, speech: false }, xp: 10, streak: { count: 0, last: null },
        langs: { [code]: { level: 'beginner', track: 'full', topics: {}, words: Object.assign({}, oldWords), speedBest: 0 } } });
      const m = T.normalizeState(old());
      const srs = m.langs[code].srs;
      if (!same(srs['a:0'], [0, today]) || !same(srs['a:1'], [0, today])) err('progress: strength 1-2 not due today ' + JSON.stringify(srs));
      ['a:2', 'a:3'].forEach((id) => { const e = srs[id]; if (!e || e[0] !== 1 || e[1] < today + 1 || e[1] > today + 3) err(`progress: ${id} seeded ${JSON.stringify(e)}`); });
      if (!srs['a:4'] || srs['a:4'][0] !== 2 || srs['a:4'][1] < today + 1 || srs['a:4'][1] > today + 7) err('progress: strength 5 seeded ' + JSON.stringify(srs['a:4']));
      if (!same(srs['a:5'], [0, today])) err('progress: strength 0 (last answers wrong) not due today ' + JSON.stringify(srs['a:5']));
      if (!same(m.langs[code].words, oldWords)) err('progress: migration changed the words');
      if (!same(T.normalizeState(old()).langs[code].srs, srs)) err('progress: seeding is not deterministic');
      if (m.settings.goal !== 50 || !same(m.daily, { day: null, xp: 0 }) || !same(m.goalLog, []) || !same(m.badges, {})) err('progress: new defaults ' + JSON.stringify([m.settings, m.daily, m.goalLog, m.badges]));
      const m2 = T.normalizeState({ v: 2, settings: { uiLang: 'en', lang: code, goal: '100' }, daily: { day: '2026-1-1', xp: '12' },
        goalLog: ['2026-1-2', 5, '2026-1-2', 'x', '2026-1-3'], badges: { first: '2026-1-1', bad: 3, odd: 'yesterday' },
        langs: { [code]: { words: { 'a:0': 5 }, srs: { 'a:0': [3, 123], bad: 'x', 'b:1': [9, 5.4] } } } });
      if (!same(m2.langs[code].srs, { 'a:0': [3, 123], 'b:1': [5, 5] })) err('progress: saved srs not kept/cleaned ' + JSON.stringify(m2.langs[code].srs));
      if (m2.settings.goal !== 100 || m2.daily.xp !== 12 || !same(m2.goalLog, ['2026-1-2', '2026-1-3']) || !same(m2.badges, { first: '2026-1-1' })) err('progress: saved fields not normalized');
      if (T.normalizeState({ settings: { uiLang: 'en', goal: 77 } }).settings.goal !== 50) err('progress: bad goal not reset to 50');
      // Built-in names as ids, unknown keys and impossible days are all dropped.
      const m3 = T.normalizeState({ v: 2, top: { a: 1 }, settings: { uiLang: 'en', lang: code, extra: 1 },
        streak: { count: 1, last: '2026-99-99' }, daily: { day: '0000-0-0', xp: 1 },
        goalLog: ['2026-13-40', '2026-2-31', '9999-1-1', '2026-11-9x', window.__TODAY],
        badges: { first: '2026-2-31', bogus: '2026-1-1', constructor: '2026-1-1', story: window.__TODAY },
        langs: { [code]: { set: 'x', srs: { constructor: [0, 0], toString: [0, 0], valueOf: [3, 0], hasOwnProperty: [0, 0], 'a:0': [0, 0] },
          words: { constructor: 1, toString: 0, valueOf: 2, 'a:0': 1 },
          topics: { constructor: { best: 1 }, t1: { best: 5, rec: 'y', stages: { mix: 2, toString: 1 } } } } } });
      const l3 = m3.langs[code];
      if (!same(Object.keys(l3.srs), ['a:0']) || !same(Object.keys(l3.words), ['a:0'])) err('progress: built-in names kept as ids ' + JSON.stringify([l3.srs, l3.words]));
      if ('top' in m3 || 'extra' in m3.settings || 'set' in l3 || !same(Object.keys(l3.topics), ['t1']) || !same(l3.topics.t1, { best: 5, stages: { mix: 2 } })) err('progress: unknown keys kept ' + JSON.stringify(m3));
      if (m3.streak.last !== null || m3.daily.day !== null || !same(m3.goalLog, [window.__TODAY]) || !same(m3.badges, { story: window.__TODAY })) err('progress: impossible days / unknown badges kept ' + JSON.stringify([m3.streak, m3.daily, m3.goalLog, m3.badges]));
      if (!same(T.BADGES.map((b) => b.id), Object.keys(T.normalizeState({ badges: Object.fromEntries(T.BADGES.map((b) => [b.id, window.__TODAY])) }).badges))) err('progress: BADGE_IDS out of step with BADGES');

      // Spaced repetition steps.
      const ls = S.langs[code];
      const words = T.ALL_WORDS;
      const it = words[0];
      // Even if built-in names get into memory, the item lookup must not find functions.
      ls.srs = { constructor: [0, 0], toString: [0, 0], valueOf: [0, 0] }; ls.words = { constructor: 1, toString: 0, hasOwnProperty: 0, valueOf: 1 };
      if (T.srsDue().length) err('progress: built-in names came back as due items');
      ls.srs = {}; ls.words = {};
      T.srsAnswer(it, true);
      if (!same(ls.srs[it.id], [0, today + 1])) err('progress: new right answer not due tomorrow ' + JSON.stringify(ls.srs[it.id]));
      T.srsAnswer(it, true);
      if (!same(ls.srs[it.id], [0, today + 1])) err('progress: right before due changed the schedule');
      T.shiftDays(1); T.srsAnswer(it, true);
      if (!same(ls.srs[it.id], [1, today + 1 + 3])) err('progress: due right answer not step 1 / +3 ' + JSON.stringify(ls.srs[it.id]));
      T.shiftDays(4); T.srsAnswer(it, true);
      if (!same(ls.srs[it.id], [2, today + 4 + 7])) err('progress: step 2 / +7 ' + JSON.stringify(ls.srs[it.id]));
      T.srsAnswer(it, false);
      if (!same(ls.srs[it.id], [0, today + 4])) err('progress: wrong answer not step 0 / today');
      ls.srs[it.id] = [5, today + 2]; T.shiftDays(2); T.srsAnswer(it, true);
      if (!same(ls.srs[it.id], [5, today + 2 + 90])) err('progress: last step not kept at 90 days ' + JSON.stringify(ls.srs[it.id]));
      T.shiftDays(0);

      // Due list: most overdue first, ties by lowest strength; letters only for read & write.
      const [w1, w2, w3, w4] = words;
      ls.srs = { [w1.id]: [0, today - 3], [w2.id]: [1, today], [w3.id]: [0, today], [w4.id]: [0, today + 2] };
      ls.words = { [w2.id]: 4, [w3.id]: 1 };
      if (T.srsDue().map((x) => x.id).join() !== [w1.id, w3.id, w2.id].join()) err('progress: due order ' + T.srsDue().map((x) => x.id));
      T.renderMenu();
      if (!$('#m-review .srs-due').textContent.includes('3') || !$('.srs-count') || $('.srs-count').textContent !== '3') err('progress: menu due count ' + $('#m-review').textContent);
      const letter = T.TOPICS.filter((tp) => tp.kind === 'alphabet').flatMap((tp) => tp.items)[0];
      if (letter && T.LANGS[code].script) {
        ls.srs[letter.id] = [0, today];
        if (!T.srsDue().includes(letter)) err('progress: due letter missing in read & write');
        T.patchSettings({ track: 'speak' });
        if (T.srsDue().includes(letter)) err('progress: letter due in speaking-only track');
        T.renderMenu();
        if ($('.srs-count').textContent !== '3') err('progress: speaking-only menu counts letters');
        T.patchSettings({ track: 'full' });
      }

      // Review session: up to 15 due items, the most overdue ones.
      ls.srs = {}; ls.words = {};
      const pool = words.slice(0, 20);
      pool.forEach((w, i) => (ls.srs[w.id] = [0, today - 20 + i]));
      T.startReview();
      const q = T.session().queue;
      const ids = new Set(q.flatMap((x) => (x.items || [x.item]).map((y) => y.id)));
      const want = new Set(pool.slice(0, 15).map((w) => w.id));
      if (T.session().mode !== 'review' || T.session().hard) err('progress: review session mode');
      if (ids.size !== Math.min(15, pool.length) || [...ids].some((id) => !want.has(id))) err(`progress: review took ${ids.size} items, not the 15 most overdue`);
      if (q.some((x) => x.item && x.item.isLetter && !T.readerMode())) err('progress: letters in review');
      playSession('progress review');
      const moved = pool.slice(0, 15).filter((w) => ls.srs[w.id][1] > today).length;
      const stay = pool.slice(0, 15).filter((w) => same(ls.srs[w.id], [0, today])).length;
      if (moved + stay !== Math.min(15, pool.length)) err(`progress: after review ${moved} moved + ${stay} due today`);
      if (pool.slice(15).some((w, i) => ls.srs[w.id][1] !== today - 5 + i)) err('progress: items outside the review changed');
      const left = T.srsDue().length;
      if (!left || !$('.results .srs-left') || !$('.srs-left').textContent.includes(String(left))) err('progress: review results without the words still due ' + left);

      // A failed match game only sets back the words that were in a wrong pair.
      const mtp = T.TOPICS.find((x) => x.kind !== 'alphabet' && T.stagesFor(x).includes('match') && x.items.length >= 3);
      if (mtp) {
        T.startStage(mtp, 'match');
        const mq = T.session().queue[0];
        const mi = mq.items;
        ls.srs = {}; mi.forEach((it) => (ls.srs[it.id] = [3, today]));
        const btn = (it, side) => app.querySelector(`.m-btn[data-side="${side}"][data-id="${CSS.escape(it.id)}"]`);
        btn(mi[0], 'l').click(); btn(mi[1], 'r').click();
        btn(mi[1], 'l').click(); btn(mi[0], 'r').click();
        mi.forEach((it) => { btn(it, 'l').click(); btn(it, 'r').click(); });
        if (!$('#feedback.bad')) err('progress: match with 2 mistakes not wrong');
        if (!same(ls.srs[mi[0].id], [0, today]) || !same(ls.srs[mi[1].id], [0, today])) err('progress: mismatched match words not reset ' + JSON.stringify(ls.srs));
        if (mi.slice(2).some((it) => !same(ls.srs[it.id], [4, today + 35]))) err('progress: match words matched right were set back ' + JSON.stringify(ls.srs));
      } else err('progress: no lesson with a match stage');

      // Speaking (an optional bonus) never touches the schedule.
      // The app uses the browser's own SpeechRecognition when there is one: catch the recognizer it creates.
      const SRf = window.SpeechRecognition || window.webkitSpeechRecognition;
      const P = SRf.prototype;
      const saved = ['onresult', 'start', 'abort'].map((k) => [k, Object.getOwnPropertyDescriptor(P, k)]);
      Object.defineProperty(P, 'onresult', { configurable: true, set(fn) { window.__lastRec = this; this._onres = fn; }, get() { return this._onres; } });
      Object.defineProperty(P, 'start', { configurable: true, writable: true, value() {} });
      Object.defineProperty(P, 'abort', { configurable: true, writable: true, value() {} });
      const speakTopic = T.TOPICS.find((tp) => tp.kind !== 'alphabet' && T.stagesFor(tp).includes('speaking'));
      if (speakTopic) {
        T.startStage(speakTopic, 'speaking');
        const sq = T.session().queue[0];
        const before = JSON.stringify(ls.srs);
        $('#mic').click();
        window.__lastRec.onresult({ results: [[{ transcript: sq.item.tg }]] });
        if (!$('#continue')) err('progress: fake speech answer not accepted');
        if (JSON.stringify(ls.srs) !== before) err('progress: speaking changed the review schedule');
      } else err('progress: no lesson with a speaking stage');
      saved.forEach(([k, d]) => { if (d) Object.defineProperty(P, k, d); else delete P[k]; });

      // Nothing due: a kind message and the old "hardest words" review.
      ls.srs = {}; ls.words = {};
      words.slice(0, 6).forEach((w, i) => { ls.srs[w.id] = [1, today + 3]; ls.words[w.id] = i % 3; });
      T.renderMenu();
      if ($('#m-review .srs-due').textContent !== E.srsCaughtUp || $('.srs-count')) err('progress: caught-up text ' + $('#m-review .srs-due').textContent);
      $('#m-review').click();
      if (!$('.srs-none') || !$('#srs-hardest') || !$('.srs-none h1')) err('progress: nothing-due screen');
      else {
        $('#srs-hardest').click();
        if (!$('.prompt') || !T.session().hard) err('progress: hardest words did not start');
        playSession('progress hardest');
        $('#again').click();
        if (!T.session().hard) err('progress: "practice again" after hardest words is not hardest words');
      }
      ls.srs = {}; ls.words = {};
      T.startReview();
      if (!$('.srs-none') || $('#srs-hardest') || $('.lead').textContent !== E.reviewEmpty) err('progress: empty review screen');
      T.renderMenu();
      if ($('#m-review .srs-due').textContent !== E.reviewDesc) err('progress: a new learner sees ' + $('#m-review .srs-due').textContent);

      // Daily goal.
      S.daily = { day: null, xp: 0 }; S.goalLog = []; S.settings.goal = 30;
      T.renderMenu();
      const card = $('.goal-card');
      if (!card || card.classList.contains('done') || !$('.goal-num').textContent.startsWith('0 / 30')) err('progress: goal card at 0 ' + (card && card.textContent));
      if (card && !(card.compareDocumentPosition($('.modes')) & Node.DOCUMENT_POSITION_FOLLOWING)) err('progress: goal card not above the mode buttons');
      if (card && !$('.goal-ring[role="img"]').getAttribute('aria-label').includes('30')) err('progress: goal ring label');
      T.addXP(25);
      if (S.goalLog.length || S.daily.day !== T.todayKey() || S.daily.xp !== 25) err('progress: daily xp ' + JSON.stringify(S.daily));
      const xp0 = S.xp;
      const tp = T.TOPICS.find((x) => x.kind !== 'alphabet');
      T.startStage(tp, 'truefalse');
      playSession('progress goal');
      if (!$('.celebrate .goal-toast')) err('progress: no goal message on the results screen');
      if (!S.goalLog.includes(T.todayKey()) || S.daily.xp !== 25 + (S.xp - xp0)) err('progress: goal not logged ' + JSON.stringify([S.goalLog, S.daily]));
      T.startStage(tp, 'truefalse');
      playSession('progress goal 2');
      if ($('.goal-toast')) err('progress: goal celebrated twice');
      T.renderMenu();
      if (!$('.goal-card.done') || !$('.goal-title').textContent.includes(E.goalDone) || $('.goal-toast')) err('progress: menu goal reached state');
      T.shiftDays(1); T.renderMenu();
      if (!$('.goal-num').textContent.startsWith('0 /') || $('.goal-card.done')) err('progress: goal not reset on a new day');
      T.shiftDays(0);
      S.goalLog = Array.from({ length: 400 }, (_, i) => '1990-1-' + i); S.daily = { day: null, xp: 0 };
      T.addXP(200);
      if (S.goalLog.length !== 400 || S.goalLog[399] !== T.todayKey()) err('progress: goal log not capped at 400');
      T.renderSettings();
      const g100 = app.querySelector('.goal-seg [data-v="100"]');
      if (!g100 || $$('.goal-seg button').length !== 3) err('progress: goal setting');
      else {
        g100.click();
        if (S.settings.goal !== 100 || !app.querySelector('.goal-seg [data-v="100"]').classList.contains('selected')) err('progress: goal setting not saved ' + S.settings.goal);
        if (JSON.parse(localStorage.getItem(T.STORE_KEY)).settings.goal !== 100) err('progress: goal setting not stored');
      }
      // Lowering the goal below today's XP: logged, its badge unlocks at once, and the card celebrates (no extra banner).
      S.daily = { day: T.todayKey(), xp: 35 }; S.goalLog = []; S.badges.goal1 = undefined; S.badges = JSON.parse(JSON.stringify(S.badges)); S.settings.goal = 50;
      T.renderMenu();
      if ($('.goal-card.done') || S.goalLog.length) err('progress: 35 / 50 counted as reached');
      S.settings.goal = 30;
      T.renderMenu();
      if (!S.goalLog.includes(T.todayKey()) || !S.badges.goal1) err('progress: lowered goal not logged with its badge ' + JSON.stringify([S.goalLog, S.badges]));
      if (!$('.goal-card.done.just') || $('.goal-toast')) err('progress: lowered goal not celebrated on the card');
      clearConfetti();
      T.renderMenu();
      if ($('.goal-card.just')) err('progress: goal card celebrated twice');
      // Reaching the goal with the flashcards: celebrated on the topic page.
      const ltp = T.TOPICS.find((x) => x.kind !== 'alphabet' && T.stagesFor(x).includes('learn'));
      S.daily = { day: T.todayKey(), xp: 25 }; S.goalLog = []; ls.topics[ltp.id] = { best: 0, stages: {} };
      T.renderLearn(ltp);
      for (let k = 0; k < 200 && $('#next'); k++) $('#next').click();
      if (!$('.topic-page .celebrate .goal-toast')) err('progress: goal reached with flashcards not celebrated on the topic page');
      clearConfetti();
      S.settings.goal = 100;

      // Badges.
      S.badges = {}; S.xp = 1200;
      T.renderMenu();
      const toasts = $$('.menu .badge-toast');
      const n = Object.keys(S.badges).length;
      if (!S.badges.xp1000 || !S.badges.goal1 || S.badges.xp5000) err('progress: retroactive badges ' + JSON.stringify(S.badges));
      if (toasts.length !== 1 || (n > 1 && !toasts[0].textContent.includes(E.badgeNewN.replace('{n}', n)))) err(`progress: ${toasts.length} badge banners on the menu for ${n} badges`);
      if (S.badges.xp1000 !== T.todayKey()) err('progress: badge date');
      T.renderMenu();
      if ($('.badge-toast')) err('progress: badge banner shown again');
      if (!$('.goal-badges').textContent.includes(`${n}/16`)) err('progress: badges link count ' + $('.goal-badges').textContent);
      $('.goal-badges').click();
      if (!$('.badges-page')) err('progress: badges page did not open');
      else {
        if ($$('.badge-card').length !== 16 || T.BADGES.length !== 16) err('progress: not 16 badges');
        if ($$('.badge-card.unlocked').length !== n || $$('.badge-card.unlocked .badge-date').length !== n) err('progress: unlocked cards');
        if ($$('.badge-card.locked .badge-lock').length !== 16 - n) err('progress: locked cards');
        if (!app.querySelector('[data-badge="xp5000"] .badge-lock').textContent.includes('1200/5000')) err('progress: locked badge progress');
        $('.back-btn').click();
        if (!$('.menu')) err('progress: badges back button');
      }
      S.xp = 4990;
      T.startStage(tp, 'truefalse');
      playSession('progress badge');
      if (!S.badges.xp5000 || !$$('.results .badge-toast').some((b) => b.textContent.includes(E.badge_xp5000))) err('progress: new badge not shown on results');
      $('.cele-close').click();
      if ($('.celebrate')) err('progress: banner close button');
      // Many badges at once on a results screen: one combined banner.
      const keepBadges = S.badges; S.badges = {};
      T.startStage(tp, 'truefalse');
      playSession('progress many badges');
      const many = Object.keys(S.badges).length;

        ch(0x202B) + gz + ch(0x202C), ch(0x2068) + ' ' + plain + ' ' + ch(0x2069), ch(0xFEFF) + ch(0x200F) + snapshot];

    /* ---------------- placement test (onboarding level step) ---------------- */
    async function placeAnswerAll(code, mode, uiLang) {
      const seen = [];
      const db = T.dbFor(code);
      for (let guard = 0; guard < 30; guard++) {
        await waitFor(() => $('.placement .opt:not([disabled])') || $('.place-result'));
        if ($('.place-result')) break;
        const run = T.placement();
        if (!run) { err('placement: no run while a question shows'); break; }
        const q = run.qs[run.i];
        seen.push(q);
        const where = `placement/${code}/${q.item.id}`;
        const opts = $$('.placement .opt');
        const labels = opts.map((o) => o.textContent.trim());
        if (opts.length !== 4) err(`${where}: ${opts.length} options`);
        if (new Set(labels).size !== labels.length) err(`${where}: duplicate options ${labels.join(' | ')}`);
        if (q.options.filter((o) => o.correct).length !== 1) err(`${where}: not exactly one right option`);
        if (labels.join('|') !== q.options.map((o) => o.item[uiLang]).join('|')) err(`${where}: options not in the UI language`);
        const lesson = db.TOPIC_BY_ID[q.item.topic];
        if (!lesson || !['vocab', 'phrases', 'grammar'].includes(lesson.kind) || lesson.level !== q.level) err(`${where}: from lesson ${lesson && lesson.id} (${lesson && lesson.kind}/${lesson && lesson.level}), asked as ${q.level}`);
        q.options.forEach((o) => { const l = db.TOPIC_BY_ID[o.item.topic]; if (!l || l.kind === 'alphabet') err(`${where}: option from a letters lesson`); });
        const main = $('.placement .stem .tg.primary');
        if (!main || main.textContent !== q.item.tg || main.getAttribute('lang') !== code || main.getAttribute('dir') !== T.LANGS[code].dir) err(`${where}: target not shown in its script`);
        if (q.item.tr !== q.item.tg && (!$('.placement .stem .tr.secondary') || $('.placement .stem .tr.secondary').textContent !== q.item.tr)) err(`${where}: no Latin reading under the target`);
        if (code === 'ja' && /[一-鿿]/.test(q.item.tg) && q.item.kana && (!$('.placement .stem .reading') || $('.placement .stem .reading').textContent !== q.item.kana)) err(`${where}: no kana under kanji`);
        if (!$('#place-idk') || $('.placement .lesson-head #place-exit') === null) err(`${where}: no "I don't know" / exit button`);
        if ($('.topbar')) err(`${where}: top bar shown during the test`);
        const want = typeof mode === 'function' ? mode(seen.length - 1, q) : mode;
        if (want === 'idk') $('#place-idk').click();
        else opts[q.options.findIndex((o) => o.correct === (want === 'right'))].click();
        if (!$('.placement .opt.right') || $$('.placement .opt:not([disabled])').length) err(`${where}: answer not shown / options still active`);
      }
      return seen;
    }
    function checkPlaceOrder(code, seen, where) {
      const idx = seen.map((q) => ['beginner', 'intermediate', 'advanced'].indexOf(q.level));
      if (idx.some((v, i) => i && v < idx[i - 1])) err(`${where}: levels out of order ${seen.map((q) => q.level)}`);
      const db = T.dbFor(code);
      ['beginner', 'intermediate', 'advanced'].forEach((lv) => {
        const qs = seen.filter((q) => q.level === lv);
        if (qs.length > 4) err(`${where}: ${qs.length} ${lv} questions`);
        const avail = db.TOPICS.filter((tp) => tp.level === lv && ['vocab', 'phrases', 'grammar'].includes(tp.kind)).length;
        const lessons = new Set(qs.map((q) => q.item.topic)).size;
        if (qs.length === 4 && lessons < Math.min(4, avail)) err(`${where}: ${lv} questions from only ${lessons} lessons (of ${avail})`);
      });
      if (new Set(seen.map((q) => q.item.en.toLowerCase())).size !== seen.length) err(`${where}: the same meaning asked twice`);
      // No give-aways: the reading is not in the meaning ("tatami = tatami"), and the answer has the shape of the others.
      const words = (x) => String(x || '').normalize('NFD').replace(/[\u0300-\u036f\u02b0-\u02ff]/g, '').toLowerCase().split(/[^a-z]+/).filter((w) => w.length >= 4);
      const bare = (m) => String(m || '').replace(/\([^)]*\)/g, ' ').trim();
      const sentence = (x) => { const m = String(x[html.lang === 'he' ? 'he' : 'en'] || x.en).trim(); return /[.?!؟]$/.test(m) || bare(m).split(/\s+/).length >= 4; };
      const glosses = (x) => [x[html.lang === 'he' ? 'he' : 'en'], x.en].flatMap((m) => bare(m).split(/\s*[/;,]\s*/)).map((g) => g.toLowerCase().replace(/[.?!؟]+$/, '').trim()).filter(Boolean);
      seen.forEach((q) => {
        const said = words(q.item.tr + ' ' + q.item.tg);
        if (said.some((a) => words(q.item.en).some((b) => a.startsWith(b) || b.startsWith(a)))) err(`${where}: give-away question ${q.item.tr} = ${q.item.en}`);
        if (T.placeGiveaway(q.item)) err(`${where}: give-away (sounds like the meaning) ${q.item.tr} = ${q.item.en}`);
        if (REAL && q.options) {
          const mine = sentence(q.item);
          if (q.options.filter((o) => sentence(o.item) === mine).length === 1) err(`${where}: the answer is the only ${mine ? 'sentence' : 'short one'}: ${q.options.map((o) => o.item.en).join(' | ')}`);
        }
        if (q.options) {
          const g = new Set(glosses(q.item));
          q.options.forEach((o) => { if (!o.correct && glosses(o.item).some((x) => g.has(x))) err(`${where}: a wrong option means the same as the answer: ${o.item.en} / ${q.item.en}`); });
        }
      });
    }
    async function checkPlacement() {
      T.setPlaceDelay(20);

        [{ beginner: 4, intermediate: 4, advanced: 4 }, 'advanced'], [{ beginner: 4, intermediate: 3, advanced: 3 }, 'advanced'],

        [{ beginner: 3, intermediate: 2, advanced: 0 }, 'intermediate'], [{ beginner: 2, intermediate: 4, advanced: 1 }, 'beginner'],
        [{ beginner: 4, intermediate: 1, advanced: 4 }, 'beginner'], [{}, 'beginner'],
      ];
      cases.forEach(([r, want]) => { if (T.placementLevel(r) !== want) err(`placementLevel(${JSON.stringify(r)}) = ${T.placementLevel(r)}, want ${want}`); });
      // Loanwords that sound like their meaning are never asked; real words are.
      const it = (tg, tr, en, he = 'x') => ({ tg, tr, en, he });

        it('ドライヤー', 'doraiyā', 'hair dryer'), it('ネックレス', 'nekkuresu', 'necklace'), it('ایمیل', 'imeyl', 'email'), it('畳', 'tatami', 'tatami (straw floor mat)'),
        it('restaurante', 'res-tau-RAN-te', 'restaurant')].forEach((x) => { if (!T.placeGiveaway(x)) err(`placement: give-away not caught: ${x.tr} = ${x.en}`); });
      [it('猫', 'neko', 'cat'), it('ウサギ', 'usagi', 'rabbit'), it('車', 'kuruma', 'car'), it('کتاب', 'ketâb', 'book'), it('perro', 'PE-rro', 'dog'),
        it('بيت', 'bēt', 'house')].forEach((x) => { if (T.placeGiveaway(x)) err(`placement: a real word counted as a give-away: ${x.tr} = ${x.en}`); });
      if (T.placeSentence(it('دویست', 'devist', 'two hundred (200)', 'מאתיים (200)'))) err('placement: "two hundred (200)" counted as a sentence');
      if (!T.placeSentence(it('x', 'x', 'I am learning Farsi.', 'אני לומד פרסית.'))) err('placement: a sentence not counted as one');
      const code = REAL || 'fa';
      // 1) First-time onboarding, English: everything right.

      }

      if (!REAL && expect !== 'intermediate') err('placement: fixtures should suggest intermediate, got ' + expect);

        if (T.state().xp !== 0 || Object.keys(T.state().langs[code].words).length || Object.keys(T.state().langs[code].topics).length) err('placement: XP or word progress changed');

      }
      T.setPlaceDelay(650);
    }

      // Tapping the background world never fires through the new UI (goal card, badges, settings, dialog, stories page).
      let layer = document.getElementById('theme-layer');
      const fake = document.createElement('div');
      fake.setAttribute('data-poke', 'test');
      fake.style.cssText = 'position:fixed;inset:0;pointer-events:auto';
      if (layer) layer.appendChild(fake);
      const noPoke = (sel, where) => $$(sel).forEach((el) => {
        const r = el.getBoundingClientRect();
        if (!r.width || !r.height) return;
        const x = r.left + r.width / 2; const y = r.top + r.height / 2;
        if (y < 0 || y > innerHeight) return;
        if (T.pokeTargetAt(x, y, el)) err(`integ: a tap on ${where} <${el.tagName.toLowerCase()} class="${el.getAttribute('class') || ''}"> pokes the background`);
      });
      if (layer) {
        T.renderMenu(); window.scrollTo(0, 0);
        const m = $('main').getBoundingClientRect();
        if (!T.pokeTargetAt(m.left + 2, Math.max(2, m.top + 2), $('main'))) err('integ: poke test is not working (empty page area does not poke)');
        noPoke('.goal-card, .goal-card *, .modes .mode, .modes .mode *, .srs-count', 'menu');
        T.renderBadges(); noPoke('.badge-summary .progress, .badge-card, .badge-card *', 'badges'); // the summary text sits on the page like a heading
        T.renderSettings(); noPoke('.xfer, .xfer *, .goal-seg, .goal-seg *', 'settings');
        $('#xfer-paste').value = await T.progressCode(T.state()); $('#xfer-load').click();
        await waitFor(() => document.querySelector('.xfer-modal'));
        const modal = document.querySelector('.xfer-modal');
        if (modal) {
          [modal, ...modal.querySelectorAll('*')].forEach((el) => {
            const r = el.getBoundingClientRect(); if (!r.width) return;
            if (T.pokeTargetAt(r.left + r.width / 2, r.top + r.height / 2, el)) err('integ: a tap in the replace dialog pokes the background');
          });
          if (T.pokeTargetAt(4, 4, modal)) err('integ: a tap on the dialog backdrop pokes the background');
          document.getElementById('xfer-cancel').click();
        }
        T.renderGroup(T.GROUPS.find((x) => x.id === T.STORY_GROUP)); noPoke('.story-level .topic, .story-level .topic *', 'stories page');
        T.startStory(dlg);
        if (!html.classList.contains('calm') || T.pokeTargetAt(4, 4, $('main'))) err('integ: the story player is not calm');
        fake.remove();
      }
      T.renderMenu();
    }

    /* ---------------- run ---------------- */
    const langs = REAL ? [REAL] : ['fa', 'es', 'ja', 'ar'];
    for (const code of langs) await runLanguage(code);
    await step('onboarding', checkOnboarding);
    await step('switching', checkSwitching);
    await step('themes', checkThemes);
    await step('answers', checkAnswers);
    await step('progress', checkProgress);
    await step('report', checkReport);
    await step('transfer', checkTransfer);
    await step('import safety', checkImportSafety);
    await step('placement', checkPlacement);
    await step('integration', checkIntegration);

    // Every string key exists in both languages, and no t('...') key used was missing.
    Object.keys(STR.en).forEach((k) => { if (STR.he[k] === undefined) err(`string ${k} missing in Hebrew`); });
    Object.keys(STR.he).forEach((k) => { if (STR.en[k] === undefined) err(`string ${k} missing in English`); });
    T.missingStrings().forEach((k) => err(`string used but missing: ${k}`));
    ['en', 'he'].forEach((u) => Object.keys(STR[u]).forEach((k) => {
      if (!/_fa$/.test(k) && /Pishi|Farsi|Persian|פישי|פרסית|פרסי/.test(JSON.stringify(STR[u][k]))) err(`string ${u}.${k} still mentions Farsi/Pishi: ${STR[u][k]}`);
    }));

    // Finally: a speed round left through the top bar must never pop up "Time's up!" later.
    await T.setSettings({ uiLang: 'en', lang: langs[0], level: 'beginner', track: 'speak', speech: false });
    T.startSpeed();
    $('.brand').click();
    const xp = T.state().xp;
    out.textContent = 'running… (letting timers run)';
    setTimeout(() => {
      if (!$('.menu')) err('a speed round left via the logo replaced the screen later');
      if (T.state().xp !== xp) err('a speed round left via the logo granted XP later');
      if (window.__intervals.size) err('an interval is still running at the end');
      finishOutput();
    }, 3000);
  })().catch((e) => { window.__errors.push('test crashed: ' + e.stack); document.getElementById('out').textContent = 'FAIL\n' + window.__errors.join('\n'); });
  </script>
</body>
