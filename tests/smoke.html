<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Smoke test</title>
  <meta name="theme-color" content="#ffc93c">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/themes/fa.css">
  <link rel="stylesheet" href="../css/themes/es.css">
  <link rel="stylesheet" href="../css/themes/ja.css">
  <link rel="stylesheet" href="../css/themes/ar.css">
  <style>*, *::before, *::after { animation: none !important; transition: none !important; }</style>
  <!--
    Automated smoke test. Open this file in a browser, or run headless:
      msedge --headless --disable-gpu --user-data-dir=<temp dir> --allow-file-access-from-files
             --virtual-time-budget=60000 --dump-dom tests/smoke.html
    It prints PASS or FAIL at the top of the page (the #out box).

    smoke.html          every language, using the small packs in tests/fixtures/data/ (fast).
    smoke.html?lang=ja  the REAL lessons of one language (js/data/ja/), the other languages from fixtures.

    For every language: menu -> topic -> sub-topic -> every exercise, in English and Hebrew, both tracks
    (where the language has a script), dictionary, review, speed round timer, distractors, theme
    (data-lang, mascot, decorations). Plus: onboarding with the language picker, switching languages
    (progress kept separate), migration of an old Farsi save, lazy loading (missing/broken files skipped),
    the fallback theme, answer checking per language, and that every string exists in both languages.
    Dialogues & stories: the menu button and group page, both players driven to the results (right and wrong
    answers, stars, XP, saved record), tap-to-translate, show-all, and the chat sides mirrored in Hebrew.
  -->
</head>
<body>
  <pre id="out">running…</pre>
  <div id="app" class="app"></div>
  <script>
    window.__errors = [];
    // The broken fixture file throws a syntax error on purpose; the app must simply skip it.
    window.addEventListener('error', (e) => {
      if (/fixtures\/data\/.*broken\.js/.test(e.filename || '')) { window.__brokenSeen = true; return; }
      window.__errors.push('window error: ' + e.message + ' ' + (e.filename || '') + ':' + (e.lineno || ''));
    });
    window.addEventListener('unhandledrejection', (e) => window.__errors.push('unhandled rejection: ' + (e.reason && e.reason.stack || e.reason)));
    window.confirm = () => true;
    // Track running intervals, to check that the speed round's timer stops when the user leaves.
    window.__intervals = new Set();
    const realSet = window.setInterval, realClear = window.clearInterval;
    window.setInterval = function () { const id = realSet.apply(window, arguments); window.__intervals.add(id); return id; };
    window.clearInterval = function (id) { window.__intervals.delete(id); return realClear.call(window, id); };
    // Fake speech recognition so the optional Speaking exercise can be tested headless.
    window.webkitSpeechRecognition = function () { this.start = () => {}; this.abort = () => {}; };

    // Which language runs on its real files (?lang=xx); all others use the fixtures.
    window.__REAL = new URLSearchParams(location.search).get('lang');
    const FIXTURE_FILES = {
      fa: ['alphabet', 'basics', 'verbs', 'missing', '../es/broken', 'stories'],
      es: ['sounds', 'basics', 'verbs', 'missing', 'broken', 'stories'],
      ja: ['kana', 'basics', 'verbs', 'stories'],
      ar: ['alphabet', 'basics', 'verbs', 'stories'],
    };
    window.TLAP_CONFIG = { files: {}, base: {} };
    Object.keys(FIXTURE_FILES).forEach((l) => {
      if (l === window.__REAL) return;
      window.TLAP_CONFIG.files[l] = FIXTURE_FILES[l];
      window.TLAP_CONFIG.base[l] = 'fixtures/data/' + l + '/';
    });
    window.__TODAY = (() => { const d = new Date(); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); })();
    try {
      localStorage.clear();
      // A save from the single-language Farsi app (with a v1 star rating) must move into langs.fa.
      localStorage.setItem('tlap-v1', JSON.stringify({
        settings: { uiLang: 'en', level: 'beginner', track: 'full', speech: false },
        topics: { 'v1-topic': { stars: 2, best: 80 }, greetings: { best: 90, stages: { learn: 3, choice: 2 } } },
        words: { 'greetings:0': 4, 'greetings:1': 1 }, xp: 5, streak: { count: 3, last: window.__TODAY }, speedBest: 9,
      }));
    } catch (e) {}
  </script>
  <script src="../js/registry.js"></script>
  <script src="../js/themes/fa.js"></script>
  <script src="../js/themes/es.js"></script>
  <script src="../js/themes/ja.js"></script>
  <script src="../js/themes/ar.js"></script>
  <script src="../js/strings.js"></script>
  <script src="../js/app.js"></script>
  <script>
  (async function () {
    const T = window.__TLAP_TEST__;
    const STR = window.TLAP_STRINGS;
    const REAL = window.__REAL;
    const app = document.getElementById('app');
    const out = document.getElementById('out');
    const html = document.documentElement;
    const errors = window.__errors;
    const $ = (s) => app.querySelector(s);
    const $$ = (s) => Array.from(app.querySelectorAll(s));
    const tmp = document.createElement('div');
    const textOf = (h) => { tmp.innerHTML = h; return tmp.textContent.replace(/\s+/g, ' ').trim(); };
    const low = (s) => String(s == null ? '' : s).trim().toLowerCase();
    const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
    const waitFor = async (fn, ms = 8000) => { const t0 = Date.now(); while (!fn() && Date.now() - t0 < ms) await sleep(10); return fn(); };
    const started = Date.now();
    let questions = 0, sessions = 0, cards = 0, distractorChecks = 0, storyPlays = 0, storyChecks = 0;
    const stats = [];
    const err = (m) => { if (errors.length < 400) errors.push(m); };
    const step = async (where, fn) => { try { await fn(); } catch (e) { err(`${where}: ${e.message}\n${e.stack}`); } };
    const clearConfetti = () => document.querySelectorAll('.confetti').forEach((c) => c.remove());
    const langState = (code) => T.state().langs[code] || {};

    function finishOutput() {
      out.textContent = (errors.length ? 'FAIL (' + errors.length + ' problems)\n' + errors.slice(0, 80).join('\n') : 'PASS')
        + `\nmode=${REAL ? 'real data for ' + REAL : 'fixtures'} ${stats.join(' | ')}`
        + `\nsessions=${sessions} questions=${questions} cards=${cards} distractorChecks=${distractorChecks}`
        + ` stories=${storyPlays}/${storyChecks} seconds=${Math.round((Date.now() - started) / 1000)}`;
      app.innerHTML = '';
    }

    /* ---------------- startup: migration + lazy loading ---------------- */
    await step('startup', async () => {
      await T.ready();
      const S = T.state();
      if (S.v !== 2) err('state version not 2');
      if (!S.settings || S.settings.lang !== 'fa' || S.settings.uiLang !== 'en' || S.settings.speech !== false) err('old save: settings not migrated ' + JSON.stringify(S.settings));
      const fa = S.langs.fa;
      if (!fa) { err('old save: no langs.fa'); return; }
      if (fa.level !== 'beginner' || fa.track !== 'full') err('old save: level/track not moved to langs.fa');
      if (!fa.topics['v1-topic'] || fa.topics['v1-topic'].stages.mix !== 2) err('v1 star rating not migrated to stages.mix');
      if (!fa.topics.greetings || fa.topics.greetings.stages.choice !== 2) err('topic stages not migrated');
      if (fa.words['greetings:0'] !== 4 || fa.speedBest !== 9) err('words / speedBest not migrated');
      if (S.xp !== 5 || S.streak.count !== 3) err('xp / streak not kept (global)');
      if (S.topics || S.words) err('old top-level topics/words left in the state');
      const saved = JSON.parse(localStorage.getItem(T.STORE_KEY) || 'null');
      if (!saved || !saved.langs || !saved.langs.fa) err('migrated state not saved under the new key');
      if (html.dataset.lang !== 'fa') err('data-lang not set to fa at startup: ' + html.dataset.lang);
      if (!$('.menu')) err('startup did not show the Farsi menu');
      // Only the current language was loaded.
      ['es', 'ja', 'ar'].forEach((c) => {
        if (T.loaded(c) || (window.TLAP_DATA.langs[c] && window.TLAP_DATA.langs[c].groups.length)) err(`${c} lessons loaded at startup`);
        if (document.querySelector(`script[data-tlap-lang="${c}"]`)) err(`${c} script tags injected at startup`);
      });
      // A missing file and a broken file are skipped; the rest still loads, in manifest order.
      const lazy = REAL === 'fa' ? 'es' : 'fa';
      if (lazy !== 'fa') await T.ensureLoaded(lazy);
      const rep = T.loadReport(lazy);
      if (!rep) { err('no load report'); return; }
      if (!rep.failed.includes('missing')) err(`${lazy}: missing file not reported as failed`);
      if (!rep.failed.some((f) => /broken/.test(f))) err(`${lazy}: broken file not reported as failed`);
      if (rep.loaded.length !== 4) err(`${lazy}: ${rep.loaded.length} files loaded, expected 4`);
      if (!window.__brokenSeen) err('broken fixture never ran (test setup)');
      if (lazy === 'fa') {
        const ids = T.GROUPS.map((g) => g.id).join();
        if (ids !== 'g-alphabet,g-basics,g-verbs,g-stories') err('groups not in manifest order: ' + ids);
      }
    });

    /* ---------------- one language, all screens ---------------- */
    function autoAnswer(where) {
      const q = T.session().queue[T.session().idx];
      if ($('.type-in')) { $('.type-in').value = T.typedAnswer(q.item); $('#check').click(); }
      else if ($('.match')) {
        const left = $$('.m-btn[data-side="l"]');
        left.forEach((l) => { l.click(); app.querySelector(`.m-btn[data-side="r"][data-id="${CSS.escape(l.dataset.id)}"]`).click(); });
      }
      else if ($('.spell-out')) {
        let guard = 0;
        while ($('#check').disabled && guard++ < 20) { const tl = $('.tile:not([disabled])'); if (!tl) break; tl.click(); }
        $('#check').click();
      }
      else if ($('#bank') && $('.answer-line')) {
        let guard = 0;
        while ($('#bank .tile') && guard++ < 40) $('#bank .tile').click();
        $('#check').click();
      }
      else if ($('#skip')) $('#skip').click();
      else if ($('.opt')) $('.opt').click();
      else err(where + ': no way to answer question type ' + q.type);
      const cont = $('#continue');
      if (!cont) { err(where + ': no continue button after ' + q.type); return false; }
      cont.click();
      return true;
    }
    function playSession(where) {
      sessions++;
      let guard = 0;
      while (!$('.results') && guard++ < 400) {
        if (!$('.prompt')) { err(where + ': expected a question'); return; }
        questions++;
        if (!autoAnswer(where)) return;
      }
      if (!$('.results')) err(where + ': session never finished');
      clearConfetti();
    }

    /** Every target-language span on screen is tagged with the language and its direction. */
    function checkTargetSpans(code, where) {
      const dir = T.LANGS[code].dir;
      $$('.tg').forEach((s) => {
        const l = s.getAttribute('lang');
        if (s.closest('.lang-card, .hero-tg, .lang-chip')) return;
        if (l === code && s.getAttribute('dir') !== dir && !s.classList.contains('num')) err(`${where}: .tg span lang=${l} dir=${s.getAttribute('dir')}`);
        if (!l) err(`${where}: .tg span without lang`);
      });
    }

    function playLesson(code, topic, where, nextExpected, c = {}) {
      T.renderTopic(topic);
      const stages = $$('[data-stage]').map((b) => b.dataset.stage);
      const all = T.stagesFor(topic);
      const counted = T.countedStages(topic);
      if (stages.join() !== all.join()) err(`${where}: lesson page shows ${stages} expected ${all}`);
      if ($$('[data-stage][disabled]').length) err(`${where}: some exercises are locked`);
      if (counted.includes('speaking')) err(`${where}: speaking counted toward completion`);
      if (all.includes('speaking') && !$('[data-stage="speaking"] .bonus-chip')) err(`${where}: speaking card has no bonus chip`);
      if ($$('.lesson-head h1 > *').length !== 2) err(`${where}: lesson h1 should hold icon + one title span`);
      const L = T.LANGS[code];
      if (topic.kind !== 'alphabet') {
        const script = !L.script || T.scriptTrack();
        if (all.includes('reading') !== (L.script && T.scriptTrack())) err(`${where}: reading stage shown=${all.includes('reading')}`);
        if (!L.script && (all.includes('spelling') || all.includes('reading'))) err(`${where}: reading/spelling offered for ${code}`);
        void script;
      } else if (all.includes('shapes') !== !!L.shapes) err(`${where}: letter shapes stage shown=${all.includes('shapes')} for ${code}`);
      checkTargetSpans(code, where);

      // Learn cards via the lesson page.
      app.querySelector('[data-stage="learn"]').click();
      if (!$('.counter') || $('.counter').getAttribute('dir') !== 'ltr') err(`${where}: learn counter not dir=ltr`);
      if ($$('.learn .lesson-head h1 > *').length !== 1) err(`${where}: learn h1 should hold one title span`);
      for (let i = 0; i < topic.items.length; i++) {
        if (!$('#card')) { err(where + ': learn card missing'); break; }
        const it = topic.items[i];
        if (it.isLetter && !!$('.face.back .forms') !== !!L.shapes) err(`${where}: letter forms shown=${!!$('.forms')} for ${code}`);
        if (code === 'ja' && !it.isLetter && T.readerMode() && /[一-鿿]/.test(it.tg) && it.kana && !$('.face.front .reading')) err(`${where}/${it.id}: no kana reading under a kanji word`);
        if (code === 'es' && !it.isLetter && (!$('.face.front .tg.primary') || $('.face.front .tg.primary').textContent !== it.tg)) err(`${where}/${it.id}: Spanish word is not the primary text`);
        $('#card').click(); cards++;
        if (i < topic.items.length - 1) $('#next').click();
      }
      $('#next').click(); // "Done!" returns to the lesson page
      clearConfetti();
      if (!$('.stages')) err(where + ': learn did not return to lesson page');
      if (!langState(code).topics[topic.id].stages.learn) err(where + ': learn not recorded');

      all.filter((s) => s !== 'learn').reverse().forEach((stage, k, arr) => {
        T.renderTopic(topic);
        app.querySelector(`[data-stage="${stage}"]`).click();
        if (stage === 'speaking') {
          let g = 0;
          while ($('#skip') && g++ < 60) { $('#skip').click(); $('#continue').click(); }
          if (!$('.results')) err(`${where}/speaking: skip-all did not finish`);
          if (langState(code).topics[topic.id].stages.speaking) err(`${where}/speaking: skipped session gave stars`);
          if ($('#to-topic')) $('#to-topic').click();
          return;
        }
        if (stage === 'story') playStory(`${where}/story`, topic, c);
        const types = new Set(T.session().queue.map((q) => q.type));
        const want = { choice: ['mcMeaning', 'mcReverse'], truefalse: ['trueFalse'], match: ['match'], typing: ['typeTr'],
          order: ['order'], reading: ['readScript'], spelling: ['spell'], letters: ['letterName', 'soundLetter'],
          shapes: ['formLetter'], words: ['exampleRead'] }[stage];
        if (want && [...types].some((x) => !want.includes(x))) err(`${where}/${stage}: unexpected types ${[...types]}`);
        if (stage === 'match') {
          const covered = new Set(T.session().queue.flatMap((q) => q.items.map((i) => i.id)));
          if (covered.size !== topic.items.length) err(`${where}/match: covers ${covered.size}/${topic.items.length} items`);
          if (T.session().queue.some((q) => q.items.length < 3 || q.items.length > 5)) err(`${where}/match: bad group size`);
        }
        if (stage !== 'story') playSession(`${where}/${stage}`);
        if ($('.results') && T.theme(code) && T.theme(code).decorations && T.theme(code).decorations.results
          && !$('.results-hero .theme-deco.results')) err(`${where}/${stage}: results decoration missing`);
        if (!langState(code).topics[topic.id].stages[stage]) err(`${where}/${stage}: stars not recorded`);
        const nx = $('#next-stage');
        if (nx && nx.dataset.next === 'speaking') err(`${where}/${stage}: speaking suggested as next exercise`);
        if (k === arr.length - 1) {
          if (nx) err(`${where}: "next exercise" offered although the lesson is complete`);
          const nl = $('#next-lesson');
          if (nextExpected && (!nl || nl.dataset.next !== nextExpected.id)) err(`${where}: expected "next sub-topic" ${nextExpected.id}, got ${nl && nl.dataset.next}`);
          if (!nextExpected && nl) err(`${where}: unexpected "next sub-topic" ${nl.dataset.next}`);
          if (nl) {
            nl.click();
            if (!$('.stages') || !$('.topic-page')) err(`${where}: next sub-topic did not open a lesson page`);
          }
          return;
        }
        if ($('#to-topic')) { $('#to-topic').click(); if (!$('.stages')) err(`${where}/${stage}: back to lesson failed`); }
        else err(`${where}/${stage}: no back-to-exercises button`);
      });
      const p = T.stageProgress(topic);
      if (p.done !== p.total) err(`${where}: ${p.done}/${p.total} counted stages recorded after doing all (speaking skipped)`);
    }

    /* ---------------- dialogues & stories ---------------- */
    /** The text a line shows first: the target for readers (and Spanish), the Latin letters for speakers. */
    const storyMain = (say) => (T.readerMode() ? say.tg : say.tr);
    const visible = (el) => !!el && !el.hidden && !el.closest('[hidden]');
    /**
     * Drive the story stage of a dialogue/story lesson to its results screen.
     * opts.wrongTurns / opts.wrongQs: indexes of the learner's turns / questions to answer wrong first.
     * Returns {turns, firstWrong, questions} as counted on screen.
     */
    function playStory(where, topic, c, opts = {}) {
      sessions++; storyPlays++;
      const wrongTurns = opts.wrongTurns || new Set();
      const wrongQs = opts.wrongQs || new Set();
      const res = { turns: 0, firstWrong: 0, questions: 0 };
      const main = $('main');
      if (!main || main.classList[0] !== 'practice' || !main.classList.contains('story-player')) { err(`${where}: story player main is "${main && main.className}"`); return res; }
      if (!html.classList.contains('calm')) err(`${where}: the background is not calm in the story player`);
      let guard = 0;
      if (topic.kind === 'dialogue') {
        while (!$('.results') && guard++ < 80) {
          const shown = $$('.chat-row').length;
          const line = topic.lines[shown];
          const opts3 = $$('.story-replies .opt');
          if (opts3.length) {
            questions++;
            if (!line || line.who !== 'me') { err(`${where}: reply options for a line that is not the learner's (${shown})`); return res; }
            if (opts3.length !== Math.min(3, 1 + line.wrong.length)) err(`${where}: ${opts3.length} reply options`);
            const right = opts3.filter((b) => b.querySelector('.opt-main').textContent === storyMain(line.say));
            if (right.length !== 1) { err(`${where}: ${right.length} right replies on turn ${res.turns}`); return res; }
            if (wrongTurns.has(res.turns)) {
              const bad = opts3.find((b) => b !== right[0]);
              const said = line.wrong.find((w) => storyMain(w) === bad.querySelector('.opt-main').textContent);
              bad.click();
              res.firstWrong++;
              const fb = $('#story-fb');
              if (!fb || !fb.classList.contains('bad')) err(`${where}: no wrong feedback`);
              else if (said && !fb.textContent.includes(said[c.uiLang || 'en'])) err(`${where}: wrong feedback does not say what the reply means (${said.en})`);
              else if (said && !fb.textContent.includes(storyMain(said))) err(`${where}: wrong feedback does not name the reply in the reading-mode text (${storyMain(said)})`);
              if (fb && fb.parentElement !== $('main')) err(`${where}: wrong feedback is not a direct child of main (it cannot stick to the screen bottom)`);
              if (!fb || !fb.querySelector('.mascot.mood-sad')) err(`${where}: wrong feedback has no sad mascot`);
              if (!bad.disabled || !bad.classList.contains('wrong')) err(`${where}: the wrong reply is not marked`);
              if (right[0].disabled) err(`${where}: cannot try again after a wrong reply`);
              if ($$('.chat-row').length !== shown) err(`${where}: a wrong reply was added to the chat`);
            }
            right[0].click();
            res.turns++;
            const rows = $$('.chat-row');
            const last = rows[rows.length - 1];
            if (rows.length !== shown + 1 || !last.classList.contains('me')) err(`${where}: the right reply did not become the learner's bubble`);
            else if (last.querySelector('.story-say .primary').textContent !== storyMain(line.say)) err(`${where}: learner bubble text`);
            if (last && last.querySelector('.chat-avatar')) err(`${where}: learner bubble has an avatar`);
            const fb = $('#story-fb');
            if (!fb || !fb.classList.contains('ok') || !fb.querySelector('.mascot.mood-cheer')) err(`${where}: no right feedback with a happy mascot`);
            if (fb && fb.parentElement !== $('main')) err(`${where}: right feedback is not a direct child of main`);
            if ($$('#story-fb').length > 1) err(`${where}: more than one feedback strip`);
            if (!$('#story-next')) { err(`${where}: no next button after the right reply`); return res; }
          }
          const next = $('#story-next');
          if (!next) { err(`${where}: dialogue is stuck at line ${shown}`); return res; }
          if ($$('.chat-row').length === topic.lines.length && !opts.keepOpen) { next.click(); break; }
          if ($$('.chat-row').length === topic.lines.length) return res;
          next.click();
        }
      } else {
        while ($('#story-next') && guard++ < 40) {
          const n = $$('#story-read .story-line').length;
          const say = topic.lines[n - 1].say;
          if ($$('#story-read .story-line')[n - 1].querySelector('.story-say .primary').textContent !== storyMain(say)) err(`${where}: story line ${n} text`);
          $('#story-next').click();
          if (n === topic.lines.length) break;
        }
        topic.questions.forEach((q, k) => {
          if ($('.results')) return;
          questions++;
          res.questions++;
          const prompt = $('.story-questions .prompt');
          if (!prompt) { err(`${where}: question ${k} not shown`); return; }
          if (!$('.stem').textContent.includes(q.q[c.uiLang || 'en'])) err(`${where}: question ${k} text`);
          const optsQ = $$('.story-answers .opt');
          if (optsQ.length !== q.options.length) err(`${where}: question ${k} has ${optsQ.length} options`);
          const want = q.options[q.answer][c.uiLang || 'en'];
          const right = optsQ.find((b) => b.textContent.trim() === want);
          const bad = optsQ.find((b) => b !== right);
          if (!right) { err(`${where}: question ${k}: right option "${want}" missing`); return; }
          if (!$('.story-again') || $$('.story-again .story-line').length !== topic.lines.length) err(`${where}: "read the story again" missing lines`);
          (wrongQs.has(k) ? bad : right).click();
          const fb = $('#story-fb');
          if (!fb || !fb.classList.contains(wrongQs.has(k) ? 'bad' : 'ok')) err(`${where}: question ${k} feedback`);
          if (fb && fb.parentElement !== $('main')) err(`${where}: question ${k} feedback is not a direct child of main`);
          if (wrongQs.has(k) && (!bad.classList.contains('wrong') || !right.classList.contains('right') || !fb.textContent.includes(want))) err(`${where}: question ${k}: wrong answer not explained`);
          if (optsQ.some((b) => !b.disabled)) err(`${where}: question ${k}: options still enabled`);
          $('#continue').click();
        });
      }
      if (!$('.results')) err(`${where}: story never reached the results`);
      clearConfetti();
      return res;
    }

    function checkStories(code, c, where) {
      const g = T.GROUPS.find((x) => x.id === T.STORY_GROUP);
      T.renderMenu();
      if (!g) { if ($('#m-stories')) err(`${where}: stories button without stories`); return; }
      const S = T.state();
      const ui = c.uiLang;
      const lessons = T.visibleLessons(g);
      // Lessons in level order; every one is a dialogue or story with lines.
      const lv = lessons.map((l) => ['beginner', 'intermediate', 'advanced'].indexOf(l.level));
      if (lv.join() !== lv.slice().sort((a, b) => a - b).join()) err(`${where}: stories not sorted by level: ${lessons.map((l) => l.level)}`);
      if (!REAL) {
        const cafe = lessons.find((l) => l.id === 'st_cafe');
        const gato = lessons.find((l) => l.id === 'st_gato');
        if (code === 'es' && (!cafe || cafe.lines.length !== 6 || !gato || gato.lines.length !== 6 || gato.questions.length !== 3)) err(`${where}: malformed lines/questions not skipped`);
      }
      // Menu button -> group page with one block per level, the learner's level marked.
      $('#m-stories').click();
      if (!$('.group-page') || $('.lesson-head .title-text').textContent !== g.title[ui]) { err(`${where}: stories button did not open the group page`); return; }
      const blocks = $$('.story-level');
      const levels = [...new Set(lessons.map((l) => l.level))];

      if (dlg) {

          const prim = row.querySelector('.story-say .primary');

          if (code === 'ja' && T.readerMode() && /[一-鿿]/.test(l0.say.tg) && !row.querySelector('.reading')) err(`${where}: no kana reading on a kanji line`);
          // Tap to reveal the translation, tap again to hide it.
          const b = row.querySelector('.story-line');

          b.click();
          if (visible(m)) err(`${where}: second tap did not hide the translation`);
        }
        // Show all translations, also for lines that appear later.
        $('#story-all').click();
        if ($$('.story-meaning').some((x) => !visible(x))) err(`${where}: show-all left a translation hidden`);
        if ($('#story-next')) {
          $('#story-next').click();
          if ($$('.story-meaning').some((x) => !visible(x))) err(`${where}: new line hidden while show-all is on`);
        }
        $('#story-all').click();
        if ($$('.story-meaning').some((x) => visible(x))) err(`${where}: show-all off left translations shown`);
        const res = playStory(`${where}/${dlg.id}`, dlg, c, { wrongTurns: new Set([0]), keepOpen: true });
        // Mirrored chat: the other speakers on the start side, the learner on the end side.
        const them = $('.chat-row.them .story-line');
        const me = $('.chat-row.me .story-line');
        if (them && me) {
          const a = them.getBoundingClientRect(); const bb = me.getBoundingClientRect();
          const ok = ui === 'he' ? a.right > bb.right + 10 : a.left < bb.left - 10;
          if (!ok) err(`${where}: chat sides not mirrored for ${ui} (them ${a.left}-${a.right}, me ${bb.left}-${bb.right})`);

        if (!$('.results')) { err(`${where}: chat did not end on the results`); return; }
        const turns = dlg.lines.filter((x) => x.who === 'me' && x.wrong.length).length;
        if (res.turns !== turns) err(`${where}: played ${res.turns} turns of ${turns}`);
        const pct = Math.round(((turns - 1) / turns) * 100);
        const starsWant = pct >= 90 ? 3 : pct >= 70 ? 2 : 1;
        const rec = langState(code).topics[dlg.id];
        if (!rec || rec.stages.story !== starsWant) err(`${where}: chat stars ${rec && rec.stages.story}, want ${starsWant}`);
        if (rec && rec.best !== pct) err(`${where}: chat best ${rec && rec.best}, want ${pct}`);
        if (S.xp - xp0 !== (turns - 1) * 10 + 20) err(`${where}: chat XP ${S.xp - xp0}, want ${(turns - 1) * 10 + 20}`);
        if (S.streak.last !== window.__TODAY) err(`${where}: chat did not count for the streak`);

        if (!first || first.dataset.stage !== 'story' || !first.textContent.includes(STR[ui].storyStRead)) err(`${where}: story's first stage is not "read the story"`);
        first.click();

        if (sto.intro && !$('.story-scene').textContent.includes(sto.intro[ui])) err(`${where}: story intro not shown`);
        const b = $('#story-read .story-line');
        b.click();
        if (!visible(b.querySelector('.story-meaning')) || b.querySelector('.story-meaning').textContent !== sto.lines[0].say[ui]) err(`${where}: story line translation`);
        b.click();
        const wrongQs = new Set([0]);

        if (res.questions !== sto.questions.length) err(`${where}: answered ${res.questions} of ${sto.questions.length} questions`);
        const n = sto.questions.length;
        const pct = Math.round(((n - 1) / n) * 100);
        const starsWant = pct >= 90 ? 3 : pct >= 70 ? 2 : 1;
        const rec = langState(code).topics[sto.id];
        if (!rec || rec.stages.story !== starsWant) err(`${where}: story stars ${rec && rec.stages.story}, want ${starsWant}`);
        if (!$('.results h1') || !$('.results h1').textContent.includes(STR[ui].storyStRead)) err(`${where}: story results title`);
        const p = T.stageProgress(sto);
        if (p.done !== 1) err(`${where}: story stage not counted in progress (${p.done}/${p.total})`);
      }
      if (dlg && sto) storyChecks++;
      T.renderMenu();
    }

    function checkDistractors(code, c, where) {
      const L = T.LANGS[code];
      const types = (it) => (it.isLetter ? ['letterName', 'soundLetter', 'exampleRead'].concat(L.shapes ? ['formLetter'] : [])
        : ['mcMeaning', 'mcReverse'].concat(T.scriptTrack() ? ['readScript'] : []));
      T.TOPICS.forEach((topic) => {
        if (topic.kind === 'alphabet' && !T.visibleLessons(T.GROUPS.find((g) => g.id === topic.group)).includes(topic)) return;
        topic.items.forEach((it) => types(it).forEach((type) => {
          for (let r = 0; r < 3; r++) {
            distractorChecks++;
            const q = T.QUESTIONS[type]({ type, item: it });
            const opts = q.options;
            const right = opts.filter((o) => o.correct);
            const labels = opts.map((o) => low(textOf(o.html)));
            const tag = `${where}/${it.id}(${it.tr})/${type}`;
            if (opts.length !== 4) err(`${tag}: ${opts.length} options`);
            if (right.length !== 1 || right[0].item !== it) err(`${tag}: ${right.length} correct options`);
            if (new Set(labels).size !== labels.length) err(`${tag}: duplicate option labels ${labels.join(' | ')}`);
            opts.filter((o) => !o.correct).forEach((o) => {
              if (T.sameAnswer(it, o.item)) err(`${tag}: wrong option ${o.item.id} shares tg/tr/en/he with the answer`);
            });
          }
        }));
        topic.items.forEach((it) => {
          const many = T.distractors(it, 25, (x) => x.id);
          distractorChecks++;
          many.forEach((x) => {
            if (x === it || T.sameAnswer(it, x)) err(`${where}/${it.id}: distractor ${x.id} could also be right (${x.tg} / ${x.tr})`);
            if (!!x.isLetter !== !!it.isLetter) err(`${where}/${it.id}: distractor ${x.id} mixes letters and words`);
          });
          const own = topic.items.filter((x) => x !== it && !T.sameAnswer(it, x)).length;
          if (many.slice(0, Math.min(own, 25)).some((x) => x.topic !== it.topic)) err(`${where}/${it.id}: same-lesson distractors not preferred`);
        });
        if (topic.kind !== 'alphabet') topic.items.forEach((it) => {
          for (let r = 0; r < 4; r++) {
            const q = T.QUESTIONS.trueFalse({ type: 'trueFalse', item: it });
            if (!q.isTrue && T.sameAnswer(it, q.shown)) err(`${where}/${it.id}/trueFalse: "false" pairing shows a right answer`);
          }
        });
      });
    }

    /** Every exercise type for every item, rendered and answered. */
    function everyTypeEveryItem(code, c, where) {
      T.TOPICS.forEach((topic) => {
        if (!T.visibleLessons(T.GROUPS.find((g) => g.id === topic.group)).includes(topic)) return;
        T.startStage(topic, 'mix');
        const s = T.session();
        topic.items.forEach((item) => {
          const types = new Set(T.typesFor(item));
          if (!item.isLetter) types.add('speak');
          types.forEach((type) => {
            try {
              s.queue = [{ type, item }, { type: 'mcMeaning', item: topic.items[0] }];
              T.renderAt(0);
              questions++;
              if (['mcMeaning', 'mcReverse', 'readScript', 'letterName', 'soundLetter', 'formLetter', 'exampleRead'].includes(type)) {
                const n = $$('.opt').length;
                if (n !== 4) err(`${where}/${topic.id}/${item.tr}/${type}: ${n} options instead of 4`);
              }
              if (type === 'order') {
                const tiles = $$('#bank .tile');
                const ow = T.orderWords(item);
                if (tiles.length !== ow.words.length || tiles.length < 2) err(`${where}/${item.id}/order: ${tiles.length} tiles`);
                if (code === 'ja' && T.readerMode() && item.extra && item.extra.parts && !ow.script) err(`${where}/${item.id}/order: Japanese parts not used`);
                if (ow.script && $('#bank').getAttribute('dir') !== T.LANGS[code].dir) err(`${where}/${item.id}/order: bank dir`);
              }
              if (type === 'spell') {
                const w = T.spellWord(item);
                if (code === 'ja' && w !== (item.kana || '').replace(/[。、！？.!?]/g, '')) err(`${where}/${item.id}/spell: not built from kana (${w})`);
                if (/[ً-ٰٟـ]/.test(w)) err(`${where}/${item.id}/spell: harakat in the spelling tiles`);
              }
              autoAnswer(`${where}/${topic.id}/${item.tr}/${type}`);
            } catch (e) { err(`${where}/${topic.id}/${item.tr}/${type}: ${e.message}\n${e.stack}`); }
          });
        });
      });
    }

    function checkDictionary(code, c, where) {
      const words = T.TOPICS.filter((tp) => tp.kind !== 'alphabet').flatMap((tp) => tp.items);
      const letters = T.TOPICS.filter((tp) => tp.kind === 'alphabet').flatMap((tp) => tp.items);
      const W = langState(code).words;
      words.slice(0, 3).forEach((it) => (W[it.id] = 4));
      words.slice(3, 6).forEach((it) => (W[it.id] = 1));
      if (letters[0]) W[letters[0].id] = 5;
      T.renderMenu();
      $('#m-dict').click();
      if (!$('.dictionary')) { err(`${where}: dictionary did not open`); return; }
      const sel0 = $('#dict-group'); sel0.value = ''; sel0.dispatchEvent(new Event('change'));
      app.querySelector('[data-filter="all"]').click();
      $('#dict-q').value = ''; $('#dict-q').dispatchEvent(new Event('input')); T.dictUpdate();
      const head = $('#dict-learned').textContent;
      const name = T.LANGS[code].name[c.uiLang];
      if (!head.includes(String(words.length)) || !head.includes('3') || !head.includes(name)) err(`${where}: header "${head}" (want 3 of ${words.length} ${name})`);
      const rows = () => $$('.dict-row');
      if (rows().length !== Math.min(200, words.length)) err(`${where}: ${rows().length} rows for an empty search`);
      if (words.length > 200 && !$('.dict-more')) err(`${where}: no "showing first 200" note`);
      const letterIds = new Set(letters.map((l) => l.id));
      if (rows().some((r) => letterIds.has(r.dataset.id))) err(`${where}: alphabet letters listed`);
      const search = (q) => {
        const inp = $('#dict-q');
        inp.value = q;
        inp.dispatchEvent(new Event('input'));
        T.dictUpdate();
        return rows().map((r) => r.dataset.id);
      };
      const strip = (s) => s.normalize('NFD').replace(/[̀-ͯ]/g, '');
      // Latin letters without accents (Spanish: the word itself without accents).
      const field = code === 'es' ? 'tg' : 'tr';
      const accented = words.find((it) => /[âāáéíóúîûōūḥṣñ]/.test(it[field]) && it[field].split(' ').length === 1) || words[0];
      const plain = strip(accented[field]).replace(/[¿¡?!.]/g, '');
      if (!search(plain).includes(accented.id)) err(`${where}: search "${plain}" did not find ${accented[field]}`);
      if (!search(plain.toUpperCase()).includes(accented.id)) err(`${where}: uppercase search "${plain.toUpperCase()}" failed`);
      if (code === 'es') {
        const syl = words.find((it) => /-/.test(it.tr)) || words[0];
        if (!search(strip(syl.tr).toLowerCase()).includes(syl.id)) err(`${where}: syllable-guide search "${syl.tr}" failed`);
      }
      if (code === 'ja') {
        const kanji = words.find((it) => /[一-鿿]/.test(it.tg) && it.kana);
        if (kanji && !search(kanji.kana).includes(kanji.id)) err(`${where}: kana search "${kanji.kana}" did not find ${kanji.tg}`);
        const kata = words.find((it) => /^[゠-ヿ]+$/.test(it.tg));
        if (kata) {
          const hira = kata.tg.replace(/[ァ-ヶ]/g, (ch) => String.fromCharCode(ch.charCodeAt(0) - 0x60));
          if (!search(hira).includes(kata.id)) err(`${where}: hiragana search "${hira}" did not find katakana ${kata.tg}`);
        }
        const macron = words.find((it) => /ō/.test(it.tr) && it.tr.split(' ').length === 1);
        if (macron && !search(macron.tr.replace(/ō/g, 'ou')).includes(macron.id)) err(`${where}: rōmaji "ou" search failed for ${macron.tr}`);
      }
      if (code === 'ar') {
        const hamza = words.find((it) => /[أإآ]/.test(it.tg));
        if (hamza && !search(hamza.tg.replace(/[أإآ]/g, 'ا')).includes(hamza.id)) err(`${where}: search without hamza did not find ${hamza.tg}`);
      }
      const mid = words[Math.floor(words.length / 2)];
      if (!search(mid.he).includes(mid.id)) err(`${where}: Hebrew search "${mid.he}" failed`);
      if (!search(mid.en).includes(mid.id)) err(`${where}: English search "${mid.en}" failed`);
      if (!search(mid.tg).includes(mid.id)) err(`${where}: target search "${mid.tg}" failed`);
      const got = search('zzqqxxnotaword');
      if (got.length || !$('.dict-empty')) err(`${where}: nonsense search shows ${got.length} rows`);
      if (T.theme(code) && T.theme(code).lines && T.theme(code).lines.empty && $('.dict-empty .bubble').textContent !== T.theme(code).lines.empty[c.uiLang]) err(`${where}: empty-search line is not the theme's`);
      search('');
      const inp = $('#dict-q'); inp.value = mid.he; inp.dispatchEvent(new Event('input'));
      if (rows().length !== Math.min(200, words.length)) err(`${where}: input was not debounced`);
      search('');
      const clickFilter = (f) => { app.querySelector(`[data-filter="${f}"]`).click(); return rows(); };
      let r = clickFilter('learned');
      if (r.length !== 3 || r.some((x) => !x.querySelector('.dot.st-learned'))) err(`${where}: learned filter shows ${r.length}`);
      r = clickFilter('learning');
      if (r.length !== 3 || r.some((x) => !x.querySelector('.dot.st-learning'))) err(`${where}: learning filter shows ${r.length}`);
      r = clickFilter('new');
      if (r.some((x) => !x.querySelector('.dot.st-new')) || r.length !== Math.min(200, words.length - 6)) err(`${where}: new filter shows ${r.length}`);
      clickFilter('all');
      const sel = $('#dict-group');
      const g = T.visibleGroups().find((x) => x.lessons.some((l) => l.kind !== 'alphabet'));
      sel.value = g.id; sel.dispatchEvent(new Event('change'));
      const inGroup = new Set(g.items.map((i) => i.id));
      r = rows();
      if (!r.length || r.some((x) => !inGroup.has(x.dataset.id))) err(`${where}: group filter shows rows outside ${g.id}`);
      sel.value = ''; sel.dispatchEvent(new Event('change'));
      search(mid.he);
      const row = rows().find((x) => x.dataset.id === mid.id);
      row.click();
      if (!$('.topic-page')) err(`${where}: row click did not open a lesson`);
      else {
        const title = $('.lesson-head .title-text').textContent;
        const lesson = T.TOPICS.find((tp) => tp.id === mid.topic);
        if (title !== lesson.title[c.uiLang]) err(`${where}: row opened "${title}", expected "${lesson.title[c.uiLang]}"`);
      }
      const t0 = performance.now();
      for (let k = 0; k < 20; k++) T.dictSearch('a', 'all', '');
      const ms = (performance.now() - t0) / 20;
      if (ms > 30) err(`${where}: dictionary search takes ${ms.toFixed(1)}ms`);
    }

    function checkSpeedTimer(where) {
      const running = () => T.speedRunning() || window.__intervals.size > 0;
      const leave = [
        ['the logo', () => $('.brand').click()],
        ['settings', () => $('[data-go="settings"]').click()],
        ['the language chip', () => $('.lang-chip').click()],
        ['quit', () => $('#quit').click()],
        ['answer + menu', () => { $('.opt').click(); T.renderMenu(); }],
        ['dictionary', () => T.renderDictionary()],
      ];
      leave.forEach(([how, fn]) => {
        T.startSpeed();
        if (!T.speedRunning() || window.__intervals.size !== 1 || !$('.speed-round')) err(`${where}: speed round did not start (${how})`);
        fn();
        if (running()) err(`${where}: speed timer still running after leaving via ${how}`);
      });
      T.startSpeed(); T.startSpeed();
      if (window.__intervals.size !== 1) err(`${where}: ${window.__intervals.size} timers after starting twice`);
      T.renderMenu();
    }

    function checkMisc(code, c, where) {
      if (code === 'fa') {
        const m = T.mixed('Farsi digits: ۰ ۱ ۲ ۳ and the word سلام دوست ۲ من.');
        tmp.innerHTML = m;
        tmp.querySelectorAll('[dir="rtl"]').forEach((s) => { if (/^[\s۰-۹٠-٩]+$/.test(s.textContent)) err(`${where}: digits wrapped right-to-left`); });
        if (tmp.querySelectorAll('.num').length !== 4) err(`${where}: digit runs not isolated (${tmp.querySelectorAll('.num').length})`);
        if (!/سلام دوست ۲ من/.test([...tmp.querySelectorAll('[dir="rtl"]')].map((s) => s.textContent).join('|'))) err(`${where}: Farsi phrase with a digit split`);
      }
      if (code === 'ja') {
        tmp.innerHTML = T.mixed('Hiragana (ひらがな) and kanji (漢字).');
        const js = [...tmp.querySelectorAll('.tg[lang="ja"]')].map((s) => s.textContent);
        if (js.join('|') !== 'ひらがな|漢字') err(`${where}: Japanese runs in titles not isolated: ${js}`);
      }
      if (code === 'ar') {
        tmp.innerHTML = T.mixed('Say مرحبا (marḥaba) ٣ times.');
        if (!tmp.querySelector('.tg[lang="ar"][dir="rtl"]') || !tmp.querySelector('.tg.num')) err(`${where}: Arabic runs in titles not isolated`);
      }
      T.TOPICS.filter((tp) => tp.intro && /[۰-۹٠-٩]/.test(tp.intro.en)).forEach((tp) => {
        T.renderTopic(tp);
        $$('.intro [dir="rtl"]').forEach((s) => { if (/^[\s۰-۹٠-٩]+$/.test(s.textContent)) err(`${where}/${tp.id}: intro digits right-to-left`); });
      });
      T.renderMenu();
      const c1 = getComputedStyle($('.brand-mark')).color;
      if (c1 !== 'rgb(43, 45, 66)') err(`${where}: logo text color ${c1}`);
      const glyph = T.TOPICS.find((tp) => /\p{L}/u.test(tp.icon || ''));
      if (glyph) {
        T.renderTopic(glyph);
        const c2 = getComputedStyle($('.title-icon .icon-tg')).color;
        if (c2 !== 'rgb(43, 45, 66)') err(`${where}: letter header icon color ${c2}`);
      }
      // Bonus rule on the menu: all counted stages done (no speaking) => trophy on lesson and group.
      const g = T.visibleGroups().find((x) => x.lessons.some((l) => l.kind !== 'alphabet'));
      const topics = langState(code).topics;
      T.visibleLessons(g).forEach((tp) => {
        topics[tp.id] = { best: 100, stages: {} };
        T.countedStages(tp).forEach((s) => (topics[tp.id].stages[s] = 3));
      });
      if (!T.stagesFor(g.lessons[0]).includes('speaking')) err(`${where}: speech on but no speaking stage`);
      T.renderMenu();
      if (!app.querySelector(`[data-group="${CSS.escape(g.id)}"] .done-badge`)) err(`${where}: group without speaking not complete`);
      T.renderGroup(g);
      if ($$('[data-topic] .done-badge').length !== T.visibleLessons(g).length) err(`${where}: lessons without speaking not complete`);
      if (T.nextLessonAfter(g.lessons[0]) && T.visibleLessons(g).length > 1 && T.nextLessonAfter(g.lessons[0]) !== g.lessons[1]) err(`${where}: nextLessonAfter fallback wrong`);
      // Settings: track only for languages with a script; the language list is there.
      T.renderSettings();
      if (!!$('.seg[data-name="track"]') !== !!T.LANGS[code].script) err(`${where}: track setting shown=${!!$('.seg[data-name="track"]')}`);
      if ($$('.lang-seg [data-pick]').length !== 4) err(`${where}: settings language list`);
    }

    async function runLanguage(code) {
      const L = T.LANGS[code];
      const combos = L.script ? [
        { uiLang: 'en', track: 'full', level: 'beginner', speech: true, full: true },
        { uiLang: 'he', track: 'speak', level: 'intermediate', speech: false, full: true },
        { uiLang: 'en', track: 'speak', level: 'advanced', speech: true, full: false },
        { uiLang: 'he', track: 'full', level: 'beginner', speech: false, full: false },
      ] : [
        { uiLang: 'en', track: 'full', level: 'beginner', speech: true, full: true },
        { uiLang: 'he', track: 'full', level: 'intermediate', speech: false, full: true },
        { uiLang: 'en', track: 'full', level: 'advanced', speech: false, full: false },
      ];
      for (const c of combos) {
        const where = `${code}/${c.uiLang}/${c.track}`;
        const set = () => T.setSettings(Object.assign({ lang: code }, c));
        await step(where + ' load', set);
        if (T.cur() !== code || !T.GROUPS.length) { err(`${where}: language did not load`); continue; }
        await step(where + ' navigation', () => checkNavigation(code, c, where));
        await step(where + ' stories', () => checkStories(code, c, where));
        await step(where + ' lessons', () => T.visibleGroups().forEach((g) => {
          const lessons = T.visibleLessons(g);
          const play = c.full ? lessons : lessons.slice(0, 1);
          play.forEach((tp, i) => {
            try { playLesson(code, tp, `${where}/${tp.id}`, lessons[i + 1] || null, c); }
            catch (e) { err(`${where}/${tp.id}: ${e.message}\n${e.stack}`); }
          });
        }));
        await step(where + ' review', () => {
          T.startReview(); sessions++;
          let guard = 0;
          while (!$('.results') && guard++ < 100) { questions++; if (!autoAnswer('review')) break; }
          if (!$('.results')) err(`${where}: review never finished`);
          T.renderSettings();
        });
        await step(where + ' distractors', () => checkDistractors(code, c, where));
        if (!c.full) await step(where + ' every type', () => everyTypeEveryItem(code, c, where));
        if (c.track === 'speak' || (!L.script && c.uiLang === 'he')) await step(where + ' learn card fit', () => checkLearnCardFit(where));
        await set();
        await step(where + ' dictionary', () => checkDictionary(code, c, where));
        await step(where + ' speed timer', () => checkSpeedTimer(where));
        T.patchSettings({ speech: true });
        await step(where + ' misc', () => checkMisc(code, c, where));
      }
      const words = T.TOPICS.filter((tp) => tp.kind !== 'alphabet').reduce((n, tp) => n + tp.items.length, 0);
      const letters = T.TOPICS.filter((tp) => tp.kind === 'alphabet').reduce((n, tp) => n + tp.items.length, 0);
      stats.push(`${code}: groups=${T.GROUPS.length} lessons=${T.TOPICS.length} words=${words} letters=${letters} theme=${T.theme(code) ? 'yes' : 'FALLBACK'}`);
    }

    /* ---------------- switching languages keeps progress separate ---------------- */
    async function checkSwitching() {
      await T.setSettings({ uiLang: 'en', lang: 'fa', level: 'beginner', track: 'full', speech: false });
      const S = T.state();
      const faTopic = T.TOPICS.find((tp) => tp.kind !== 'alphabet');
      S.langs.fa.topics[faTopic.id] = { best: 100, stages: { learn: 3, choice: 3 } };
      S.langs.fa.words[faTopic.items[0].id] = 5;
      S.langs.fa.speedBest = 12;
      S.xp = 50;
      T.renderMenu();
      $('.lang-chip').click();
      if (!$('.lang-page') || $$('.lang-card').length !== 4) { err('language chip did not open the picker'); return; }
      if (!app.querySelector('[data-pick="fa"].selected')) err('current language not marked in the picker');
      app.querySelector('[data-pick="ar"]').click();
      // A new language is set up first (level + track only).
      if (!$('.onboard')) { err('new language: no set-up screen'); return; }
      if (html.dataset.lang !== 'ar') err('set-up screen not in the Arabic theme');
      if ($$('.dots i').length !== 2) err(`new-language set-up has ${$$('.dots i').length} steps, expected 2`);
      $$('.choice')[1].click(); $('#ob-next').click();
      $$('.choice')[0].click(); $('#ob-next').click();
      await waitFor(() => $('.menu') && T.cur() === 'ar');
      if (T.cur() !== 'ar' || !$('.menu')) { err('switch to Arabic failed'); return; }
      if (S.langs.ar.level !== 'intermediate' || S.langs.ar.track !== 'speak') err('Arabic set-up not saved');
      if (Object.keys(S.langs.ar.topics).length || Object.keys(S.langs.ar.words).length) err('Arabic started with progress from another language');
      if (S.langs.fa.topics[faTopic.id].stages.choice !== 3 || S.langs.fa.words[faTopic.items[0].id] !== 5) err('Farsi progress changed by switching');
      if (S.xp !== 50) err('XP is not global');
      if ($('.mode.speed small').textContent.includes('12')) err('Farsi speed record shown for Arabic');
      if ($$('.menu .mini-bar i').some((i) => parseFloat(i.style.width) > 0)) err('Arabic menu shows progress');
      // Practise a bit in Arabic: only Arabic progress changes.
      const arTopic = T.TOPICS.find((tp) => tp.kind !== 'alphabet');
      T.startStage(arTopic, 'truefalse');
      playSession('switch/ar');
      if (!S.langs.ar.topics[arTopic.id]) err('Arabic progress not recorded under langs.ar');
      const faWords = JSON.stringify(S.langs.fa.words);
      // Back to Farsi from Settings: it's set up, so it opens straight away with its own progress.
      T.renderSettings();
      app.querySelector('.lang-seg [data-pick="fa"]').click();
      await waitFor(() => $('.menu') && T.cur() === 'fa');
      if (T.cur() !== 'fa' || html.dataset.lang !== 'fa') { err('switch back to Farsi failed'); return; }
      if (JSON.stringify(S.langs.fa.words) !== faWords) err('Farsi words changed while practising Arabic');
      if (!$('.mode.speed small').textContent.includes('12')) err('Farsi speed record lost');
      if (!$$('.menu .mini-bar i').some((i) => parseFloat(i.style.width) > 0)) err('Farsi progress not shown after switching back');
      T.renderDictionary();
      if (!$('#dict-learned').textContent.includes('1')) err('Farsi dictionary lost its learned word');
      // Same lesson ids in two languages never share progress.
      if (S.langs.ar.topics[faTopic.id] && faTopic.id !== arTopic.id) err('Farsi topic id showed up in Arabic');
      // Persisted.
      const saved = JSON.parse(localStorage.getItem(T.STORE_KEY));
      if (!saved.langs.ar || !saved.langs.fa || saved.settings.lang !== 'fa') err('per-language state not saved');
    }

    /* ---------------- themes: fallback when missing or broken ---------------- */
    async function checkThemes() {
      await T.setSettings({ uiLang: 'en', lang: 'es', level: 'beginner', track: 'full', speech: false });
      const real = window.TLAP_THEMES.es;
      delete window.TLAP_THEMES.es;
      T.applyTheme('es');
      T.renderMenu();
      if (!$('.menu .mascot .fallback-mascot')) err('missing theme: no fallback mascot');
      if ($('.theme-deco')) err('missing theme: decorations shown');
      if (!html.classList.contains('theme-fallback')) err('missing theme: html has no theme-fallback class');
      const fb = STR.en.m_greet.map((s) => s.replace('{lang}', 'Spanish'));
      if (!fb.includes($('.menu .bubble').textContent)) err('missing theme: greeting is not a built-in line: ' + $('.menu .bubble').textContent);
      // A theme whose mascot throws, with half its lines missing.
      window.TLAP_THEMES.es = { name: { en: 'Spanish' }, mascot: { svg() { throw new Error('boom'); } }, lines: { greet: { en: [] } }, decorations: { banner: 7 } };
      T.applyTheme('es');
      T.renderMenu();
      if (!$('.menu .mascot .fallback-mascot')) err('broken theme: no fallback mascot');
      T.renderGroup(T.visibleGroups()[0]);
      if (!$('.mascot-row .bubble').textContent) err('broken theme: empty mascot line');
      if (real) window.TLAP_THEMES.es = real; else delete window.TLAP_THEMES.es;
      T.applyTheme('es');
      T.renderMenu();
      if (real && $('.menu .mascot .fallback-mascot')) err('theme not restored');
      // Every real theme renders all three moods as SVG, and has every line in both languages.
      ['fa', 'es', 'ja', 'ar'].forEach((code) => {
        const th = window.TLAP_THEMES[code];
        if (!th) return;
        ['happy', 'cheer', 'sad'].forEach((m) => { if (!/^\s*<svg/i.test(T.mascotSVG(m, code)) || /fallback-mascot/.test(T.mascotSVG(m, code))) err(`${code} theme: mascot mood ${m}`); });
        ['intro', 'greet', 'group', 'topic', 'right', 'wrong', 'empty'].forEach((k) => ['en', 'he'].forEach((u) => {
          if (!th.lines || !th.lines[k] || !th.lines[k][u] || !th.lines[k][u].length) err(`${code} theme: line ${k}.${u} missing`);
        }));
        if (!Array.isArray(th.confetti) || !th.confetti.length) err(`${code} theme: no confetti colors`);
      });
    }

      sp.forEach(([code, heard, tg, kana, want]) => { if (T.speechMatches(heard, tg, kana, code) !== want) err(`speechMatches[${code}](${heard}, ${tg}) != ${want}`); });
    }

    /* ---------------- run ---------------- */
    const langs = REAL ? [REAL] : ['fa', 'es', 'ja', 'ar'];
    for (const code of langs) await runLanguage(code);
    await step('onboarding', checkOnboarding);
    await step('switching', checkSwitching);
    await step('themes', checkThemes);
    await step('answers', checkAnswers);

    // Every string key exists in both languages, and no t('...') key used was missing.
    Object.keys(STR.en).forEach((k) => { if (STR.he[k] === undefined) err(`string ${k} missing in Hebrew`); });
    Object.keys(STR.he).forEach((k) => { if (STR.en[k] === undefined) err(`string ${k} missing in English`); });
    T.missingStrings().forEach((k) => err(`string used but missing: ${k}`));
    ['en', 'he'].forEach((u) => Object.keys(STR[u]).forEach((k) => {
      if (!/_fa$/.test(k) && /Pishi|Farsi|Persian|פישי|פרסית|פרסי/.test(JSON.stringify(STR[u][k]))) err(`string ${u}.${k} still mentions Farsi/Pishi: ${STR[u][k]}`);
    }));

    // Finally: a speed round left through the top bar must never pop up "Time's up!" later.
    await T.setSettings({ uiLang: 'en', lang: langs[0], level: 'beginner', track: 'speak', speech: false });
    T.startSpeed();
    $('.brand').click();
    const xp = T.state().xp;
    out.textContent = 'running… (letting timers run)';
    setTimeout(() => {
      if (!$('.menu')) err('a speed round left via the logo replaced the screen later');
      if (T.state().xp !== xp) err('a speed round left via the logo granted XP later');
      if (window.__intervals.size) err('an interval is still running at the end');
      finishOutput();
    }, 3000);
  })().catch((e) => { window.__errors.push('test crashed: ' + e.stack); document.getElementById('out').textContent = 'FAIL\n' + window.__errors.join('\n'); });
  </script>
</body>
